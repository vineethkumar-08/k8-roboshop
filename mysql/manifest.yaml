apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql 
  namespace: roboshop
  labels:
    project: roboshop
    environment: dev
    tier: database
    component: mysql
spec:
  replicas: 1
  selector:
    matchLabels:
      project: roboshop
      environment: dev
      tier: database
      component: mysql
  template:
    metadata:
      labels:
        project: roboshop
        environment: dev
        tier: database
        component: mysql
    spec:
      containers:
      - name: mysql
        image: vineethk08/mysql:1.4.0
---
apiVersion: v1
kind: Service
metadata:
  name: mysql
  namespace: roboshop
  labels:
    project: roboshop
    environment: dev
    tier: database
    component: mysql
spec:
  selector:
    project: roboshop
    environment: dev
    tier: database
    component: mysql
  ports:
  - protocol: TCP
    port: 3306
    targetPort: 3306

